name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Install dependencies
        timeout-minutes: 5
        env:
          # Private @merchbaseco/* packages install with the workflow's own
          # repository-scoped token; no 1Password access is involved.
          MERCHBASE_GITHUB_NPM_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      # `check:fast` pins the schema's `test` lifecycle itself, so CI needs no
      # environment selector and no 1Password access.
      #
      # Policy, not an oversight: Quality runs the fast lane only. It
      # deliberately does not run `bun run server:build` — the Deploy workflow
      # builds the image for real on the Mac mini and is the build's proof.
      # `bun run check` is `check:fast` plus that build, and that is what gates
      # local work. Keep this job free of application builds. The server test
      # suite belongs here because it earns its place: no database, no network,
      # under a second of pure CPU. Anything needing a database goes to the
      # parallel job below instead.
      - name: Run fast quality gates
        run: bun run check:fast

  # The database-backed half of the server suite, which skips itself without a
  # real PostgreSQL. It runs beside `check` rather than inside it so the fast
  # lane still answers in about a minute, and it uses the same throwaway
  # cluster the script builds locally — a private data directory under
  # `mktemp -d`, torn down on exit — rather than a service container, so CI and
  # a checkout prove the same path.
  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Install dependencies
        timeout-minutes: 5
        env:
          MERCHBASE_GITHUB_NPM_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      # The runner image ships PostgreSQL's server binaries but leaves them off
      # PATH, and the script needs `initdb` and `pg_ctl` to build its cluster.
      - name: Put PostgreSQL on PATH
        run: |
          set -euo pipefail
          postgres_bin_dir="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "Using ${postgres_bin_dir}"
          echo "${postgres_bin_dir}" >> "$GITHUB_PATH"

      - name: Run database-backed server tests
        run: bun run --filter @rankwrangler/server test:catalog-db
