name: Deploy Stack

env:
  PRODUCTION_CHECKOUT: /Users/zknicker/srv/rankwrangler
  DEPLOY_COMMAND: bun run deploy
  HEALTH_API_URL: https://rankwrangler.merchbase.co/api/health
  HEALTH_LIVE_URL: https://rankwrangler.merchbase.co/health/live
  HEALTH_TIMEOUT_SECONDS: '180'

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: SHA on main to deploy. Set this to roll back. Leave it empty to redeploy the selected tip.
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  packages: read

concurrency:
  group: rankwrangler-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Stack
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      deployed: ${{ steps.sync.outputs.deployed }}
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve the target commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          QUALITY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="$QUALITY_SHA"
          explicit_ref=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sha="$DISPATCH_SHA"
            if [ -n "$INPUT_REF" ]; then
              sha="$INPUT_REF"
              explicit_ref=true
            fi
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Target must be a 40-character lowercase SHA." >&2
            exit 1
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'explicit_ref=%s\n' "$explicit_ref" >> "$GITHUB_OUTPUT"

      - name: Sync the deployment checkout
        id: sync
        working-directory: ${{ env.PRODUCTION_CHECKOUT }}
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          EXPLICIT_REF: ${{ steps.target.outputs.explicit_ref }}
          PRODUCTION_CHECKOUT: ${{ env.PRODUCTION_CHECKOUT }}
        run: bun "${GITHUB_WORKSPACE}/scripts/deploy/sync-production-checkout.mjs"

      - name: Install dependencies
        if: steps.sync.outputs.decision != 'skip'
        working-directory: ${{ env.PRODUCTION_CHECKOUT }}
        env:
          MERCHBASE_GITHUB_NPM_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      - name: Deploy
        if: steps.sync.outputs.decision != 'skip'
        working-directory: ${{ env.PRODUCTION_CHECKOUT }}
        env:
          DEPLOY_AGENT_PRODUCTION_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
          MERCHBASE_GITHUB_NPM_TOKEN: ${{ github.token }}
        run: ${{ env.DEPLOY_COMMAND }}

      - name: Verify health
        if: steps.sync.outputs.decision != 'skip'
        env:
          HEALTH_REVISION: ${{ steps.sync.outputs.sha }}
          HEALTH_API_URL: ${{ env.HEALTH_API_URL }}
          HEALTH_LIVE_URL: ${{ env.HEALTH_LIVE_URL }}
          HEALTH_TIMEOUT_SECONDS: ${{ env.HEALTH_TIMEOUT_SECONDS }}
        run: bun "${GITHUB_WORKSPACE}/scripts/deploy/wait-for-health.mjs"

      - name: Notify Discord
        if: always() && steps.sync.outputs.decision != 'skip'
        continue-on-error: true
        uses: merchbaseco/captainhook/.github/actions/deploy-notify@v1
        with:
          discord-webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          job-status: ${{ job.status }}

  publish:
    name: Publish packages
    needs: deploy
    if: needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish packages that are not on npm
        working-directory: ${{ env.PRODUCTION_CHECKOUT }}
        env:
          PRODUCTION_CHECKOUT: ${{ env.PRODUCTION_CHECKOUT }}
          TARGET_SHA: ${{ needs.deploy.outputs.sha }}
          DEPLOY_AGENT_PRODUCTION_OP_TOKEN: ${{ secrets.GH_DEPLOY_AGENT_PRODUCTION_OP_TOKEN }}
          RANKWRANGLER_RESOLVE_RELEASE_TOKENS: 'true'
          VARLOCK_ENV: production
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun "${GITHUB_WORKSPACE}/scripts/release/publish-if-needed.mjs"

  version-backstop:
    name: Version bump backstop
    needs: [deploy, publish]
    if: >-
      always() && needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true'
      && needs.publish.result != 'cancelled'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fail when a published package changed without a bump
        working-directory: ${{ env.PRODUCTION_CHECKOUT }}
        env:
          PRODUCTION_CHECKOUT: ${{ env.PRODUCTION_CHECKOUT }}
        run: bun "${GITHUB_WORKSPACE}/scripts/release/check-version-bumped.mjs"
