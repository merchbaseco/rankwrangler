name: Deploy Stack

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: SHA on main to deploy. Set this to roll back.
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  packages: read

concurrency:
  group: rankwrangler-production
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve target
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      explicit_ref: ${{ steps.target.outputs.explicit_ref }}
    steps:
      - name: Resolve the target commit
        id: target
        env:
          REF: ${{ github.event.inputs.ref }}
          SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${REF:-$SHA}"
          explicit_ref=false
          if [ -n "$REF" ]; then
            explicit_ref=true
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Target must be a 40-character lowercase SHA." >&2
            exit 1
          fi
          printf 'sha=%s\nexplicit_ref=%s\n' "$sha" "$explicit_ref" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: resolve
    uses: merchbaseco/workflows/.github/workflows/deploy-service.yml@main
    secrets: inherit
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      explicit_ref: ${{ needs.resolve.outputs.explicit_ref == 'true' }}
      production_checkout: /Users/zknicker/srv/rankwrangler
      deploy_command: bun run deploy
      health_urls: https://rankwrangler.merchbase.co/health/live https://rankwrangler.merchbase.co/api/health
      runner: self-hosted
      published_packages: packages/http-client:@rankwrangler/http-client,packages/cli:@rankwrangler/cli
      publish_provenance: true
      bun_version: "1.4.2"
      prepublish_command: bun run release:check && bun run cli:build && bun run release:check-cli-pack
      release_token_env_name: RELEASE_AGENT_TOOLING_OP_TOKEN
      release_switch_env_name: RANKWRANGLER_RESOLVE_RELEASE_TOKENS
