services:
  postgres:
    image: postgres:15-alpine
    container_name: rankwrangler-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      # Postgres' own literal names are required by the image. Values come
      # from the schema so the database and the server cannot drift apart.
      POSTGRES_DB: ${RANKWRANGLER_DATABASE_NAME}
      POSTGRES_USER: ${RANKWRANGLER_DATABASE_USER}
      POSTGRES_PASSWORD: ${RANKWRANGLER_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rankwrangler
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rankwrangler -d rankwrangler"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      # Build from repo root so Bun workspaces (packages/*) are available.
      context: ../..
      dockerfile: apps/server/Dockerfile
      secrets:
        - github_packages_token
    image: rankwrangler-server:local
    container_name: rankwrangler-server
    # Prevent crash-looping forever if the app fails fast (e.g. missing env vars).
    # This will retry a few times and then stop.
    restart: "on-failure:5"
    # Every value is interpolated from the process environment that
    # `varlock run` supplies; the schema is the only owner of defaults.
    environment:
      RANKWRANGLER_PORT: ${RANKWRANGLER_PORT}
      RANKWRANGLER_DATABASE_HOST: ${RANKWRANGLER_DATABASE_HOST}
      RANKWRANGLER_DATABASE_PORT: ${RANKWRANGLER_DATABASE_PORT}
      RANKWRANGLER_DATABASE_NAME: ${RANKWRANGLER_DATABASE_NAME}
      RANKWRANGLER_DATABASE_USER: ${RANKWRANGLER_DATABASE_USER}
      RANKWRANGLER_DATABASE_PASSWORD: ${RANKWRANGLER_DATABASE_PASSWORD}
      RANKWRANGLER_SPAPI_REFRESH_TOKEN: ${RANKWRANGLER_SPAPI_REFRESH_TOKEN}
      RANKWRANGLER_SPAPI_CLIENT_ID: ${RANKWRANGLER_SPAPI_CLIENT_ID}
      RANKWRANGLER_SPAPI_APP_CLIENT_SECRET: ${RANKWRANGLER_SPAPI_APP_CLIENT_SECRET}
      MERCHBASE_CLERK_SECRET_KEY: ${MERCHBASE_CLERK_SECRET_KEY}
      MERCHBASE_CLERK_PUBLISHABLE_KEY: ${MERCHBASE_CLERK_PUBLISHABLE_KEY}
      MERCHBASE_CLERK_JWT_KEY: ${MERCHBASE_CLERK_JWT_KEY}
      MERCHBASE_CLERK_ISSUER: ${MERCHBASE_CLERK_ISSUER}
      RANKWRANGLER_CLERK_AUTHORIZED_PARTIES: ${RANKWRANGLER_CLERK_AUTHORIZED_PARTIES}
      RANKWRANGLER_CLERK_WEBHOOK_SIGNING_SECRET: ${RANKWRANGLER_CLERK_WEBHOOK_SIGNING_SECRET}
      RANKWRANGLER_ADMIN_MERCHBASE_USER_ID: ${RANKWRANGLER_ADMIN_MERCHBASE_USER_ID}
      RANKWRANGLER_KEEPA_API_KEY: ${RANKWRANGLER_KEEPA_API_KEY}
      RANKWRANGLER_GEMINI_API_KEY: ${RANKWRANGLER_GEMINI_API_KEY}
      # Development-only; resolves empty in production, which disables the
      # local sign-in helper. Delivered explicitly so the contract check has
      # no exemptions.
      RANKWRANGLER_DEV_CLERK_SIGN_IN_USER_ID: ${RANKWRANGLER_DEV_CLERK_SIGN_IN_USER_ID}
      RANKWRANGLER_DISABLE_SERVER_JOB_RUNNER: ${RANKWRANGLER_DISABLE_SERVER_JOB_RUNNER}
      RANKWRANGLER_DATABASE_MIGRATION_TARGET: ${RANKWRANGLER_DATABASE_MIGRATION_TARGET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rankwrangler
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(res=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    build:
      # Build context is repo root so we can build the website workspace.
      context: ../..
      dockerfile: apps/server/Dockerfile.caddy
      secrets:
        - github_packages_token
      # Every VITE_ value the website bundle reads must be listed here AND
      # declared as an ARG in Dockerfile.caddy — the image never sees the
      # host's environment. `bun run env:contract` enforces both halves.
      args:
        VITE_RANKWRANGLER_API_URL: ${VITE_RANKWRANGLER_API_URL}
        VITE_RANKWRANGLER_APP_VERSION: ${VITE_RANKWRANGLER_APP_VERSION}
        VITE_RANKWRANGLER_DEV_CLERK_AUTO_SIGN_IN: ${VITE_RANKWRANGLER_DEV_CLERK_AUTO_SIGN_IN}
        VITE_MERCHBASE_CLERK_PUBLISHABLE_KEY: ${VITE_MERCHBASE_CLERK_PUBLISHABLE_KEY}
        VITE_MERCHBASE_CLERK_SYNC_HOST: ${VITE_MERCHBASE_CLERK_SYNC_HOST}
    image: rankwrangler-caddy:local
    container_name: rankwrangler-caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    networks:
      - rankwrangler
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  github_packages_token:
    environment: MERCHBASE_GITHUB_NPM_TOKEN

networks:
  rankwrangler:
    driver: bridge
